name: Benchmark (branch vs main)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm ci --no-audit
      - name: Bench current branch
        run: node --expose-gc ./benchmark/bench.js | tee bench-branch.txt
      - name: Bench main
        run: |
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- lib/
          git checkout HEAD -- benchmark/bench.js
          node --expose-gc ./benchmark/bench.js | tee bench-main.txt
      - name: Compare
        run: |
          node -e '
            const fs = require("fs")
            const parse = (t) => {
              const out = {}
              for (const line of t.split("\n")) {
                const m = /^(.+?)\.*\s*x\s*([\d,]+) ops\/sec/.exec(line)
                if (m) out[m[1].trim()] = parseInt(m[2].split(",").join(""), 10)
              }
              return out
            }
            const main = parse(fs.readFileSync("bench-main.txt", "utf8"))
            const branch = parse(fs.readFileSync("bench-branch.txt", "utf8"))
            let wins = 0, regress = 0
            for (const [name, hz] of Object.entries(branch)) {
              if (!(name in main)) continue
              const d = (hz - main[name]) * 100 / main[name]
              if (d > 5) wins++
              if (d < -5) regress++
              console.log(`${name.padEnd(52)} ${String(main[name]).padStart(12)} -> ${String(hz).padStart(12)} ${d > 0 ? "+" : ""}${d.toFixed(1)}%`)
            }
            console.log(`\n>5% wins: ${wins}, >5% regressions: ${regress}`)
          '
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-*.txt
