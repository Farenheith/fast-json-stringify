name: Benchmark (branch vs main)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install --no-audit --no-fund
      - name: Bench alternating passes (branch, main, branch, main)
        run: |
          node -v | tee node-version.txt
          git fetch origin main --depth=1
          for i in 1 2; do
            node --expose-gc ./benchmark/bench.js | tee "bench-branch-$i.txt"
            git checkout FETCH_HEAD -- lib/
            node --expose-gc ./benchmark/bench.js | tee "bench-main-$i.txt"
            git checkout HEAD -- lib/
          done
      - name: Compare (max per case across passes)
        run: |
          node -e '
            const fs = require("fs")
            const parse = (t) => {
              const out = {}
              for (const line of t.split("\n")) {
                const m = /^(.+?)\.*\s*x\s*([\d,]+) ops\/sec/.exec(line)
                if (m) out[m[1].trim()] = parseInt(m[2].split(",").join(""), 10)
              }
              return out
            }
            const side = (prefix) => {
              const acc = {}
              for (const f of fs.readdirSync(".").filter((f) => f.startsWith(prefix))) {
                const r = parse(fs.readFileSync(f, "utf8"))
                for (const [k, v] of Object.entries(r)) acc[k] = Math.max(acc[k] ?? 0, v)
              }
              return acc
            }
            const main = side("bench-main-")
            const branch = side("bench-branch-")
            let wins = 0, regress = 0
            for (const [name, hz] of Object.entries(branch)) {
              if (!(name in main)) continue
              const d = (hz - main[name]) * 100 / main[name]
              if (d > 5) wins++
              if (d < -5) regress++
              console.log(`${name.padEnd(52)} ${String(main[name]).padStart(12)} -> ${String(hz).padStart(12)} ${d > 0 ? "+" : ""}${d.toFixed(1)}%`)
            }
            console.log(`\n>5% wins: ${wins}, >5% regressions: ${regress}`)
          '
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench-*.txt
            node-version.txt
